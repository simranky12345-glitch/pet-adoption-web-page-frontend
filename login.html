<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PetAdopt | Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>
<i class="fa-solid fa-paw"></i>
PetAdopt
</h1>

<h2>Welcome Back!</h2>

<p>

Login to continue your journey of finding a loving companion.
Every adoption creates a happy family.

</p>

<img src="images/login-pet.png" alt="Pet">

</div>

<div class="right">

<form id="loginForm">

<h2>Login</h2>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<span id="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">
Forgot Password?

</a>

</div>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

<div class="or">

OR

</div>

<div class="social">

<a href="#">
<i class="fab fa-google"></i>
</a>

<a href="#">
<i class="fab fa-facebook-f"></i>
</a>

<a href="#">
<i class="fab fa-github"></i>
</a>

</div>

<p class="register">

Don't have an account?

<a href="register.html">

Register Here

</a>

</p>

<a href="index.html" class="home">

<i class="fa-solid fa-house"></i>

Back to Home

</a>

</form>

</div>

</div>

<script>

const password=document.getElementById("password");

const toggle=document.getElementById("togglePassword");

toggle.onclick=()=>{

if(password.type==="password"){

password.type="text";

toggle.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}

else{

password.type="password";

toggle.innerHTML='<i class="fa-solid fa-eye"></i>';

}

}

document.getElementById("loginForm").onsubmit=function(e){

e.preventDefault();

alert("✅ Login Successful! Welcome to PetAdopt ❤️");

window.location="index.html";

}

</script>

</body>

</html>
