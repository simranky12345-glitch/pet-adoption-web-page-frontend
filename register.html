
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PetAdopt | Register</title>

<link rel="stylesheet" href="register.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>
<i class="fa-solid fa-paw"></i>
PetAdopt
</h1>

<h2>Create Your Account</h2>

<p>

Join thousands of happy pet lovers and begin your adoption journey today.

</p>

<img src="images/register-pet.png" alt="Pet">

</div>

<div class="right">

<form id="registerForm">

<h2>Registration</h2>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-calendar"></i>

<input
type="date"
required>

</div>

<div class="gender">

<label>

<input type="radio" name="gender" required>

Male

</label>

<label>

<input type="radio" name="gender">

Female

</label>

<label>

<input type="radio" name="gender">

Other

</label>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<span class="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="strength">

<div id="strengthBar"></div>

</div>

<label class="terms">

<input type="checkbox" required>

I agree to the Terms & Conditions

</label>

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Create Account

</button>

<p class="login-text">

Already have an account?

<a href="login.html">

Login Here

</a>

</p>

<a href="index.html" class="home">

<i class="fa-solid fa-house"></i>

Back to Home

</a>

</form>

</div>

</div>

<script>

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

const toggle=document.querySelector(".togglePassword");

const bar=document.getElementById("strengthBar");

toggle.onclick=()=>{

if(password.type==="password"){

password.type="text";

toggle.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}else{

password.type="password";

toggle.innerHTML='<i class="fa-solid fa-eye"></i>';

}

}

password.addEventListener("keyup",()=>{

let value=password.value.length;

if(value<5){

bar.style.width="30%";

bar.style.background="red";

}

else if(value<8){

bar.style.width="60%";

bar.style.background="orange";

}

else{

bar.style.width="100%";

bar.style.background="green";

}

});

document.getElementById("registerForm").onsubmit=function(e){

e.preventDefault();

if(password.value!==confirmPassword.value){

alert("Passwords do not match!");

return;

}

alert("🎉 Registration Successful! Welcome to PetAdopt ❤️");

window.location="login.html";

}

</script>

</body>

</html>
